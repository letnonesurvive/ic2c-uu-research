authors="letnonesurvive"
description='''
An IC2 Classic addon: UU-Matter replication recipes have to be researched before they can be used.
Pick a target in the UU Research Station, feed it UU-Matter and energy, and it outputs the first craft
and unlocks the recipe for the whole world: it shows up in JEI and becomes craftable.
'''
